__ EVMUX. test de variedad de eventos __

__ Activacion de fuentes __
event-keyboard-active : true
event-mouse-active : true
event-joystick-active : true
event-camera-active : true
event-microfone-active : true
event-socket-active : true
event-http-active : true

__ Cámara __
camera-selected : HP TrueVision HD Camera
camera-width : 160
camera-height : 120


__ Micrófono __
microfone-selected : pulse


__ Redes __
socket-port : 9877
http-port : 9878


__ Secuencias __
seq-timeout-ms : 2000


